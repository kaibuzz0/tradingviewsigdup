name: Deploy Command Site repository workspace

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish command-site snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: command-site-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: command-site-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned repository site generator
        env:
          COMMAND_SITE_GENERATOR_URL: https://raw.githubusercontent.com/kaibuzz0/Git-hub-command-site/e64e94c1ee8fc3ee612ee057f494fc7268827c37/connectors/build_repo_site.py
        run: curl --fail --silent --show-error --location "$COMMAND_SITE_GENERATOR_URL" --output /tmp/build_repo_site.py
      - name: Build repository workspace
        run: python /tmp/build_repo_site.py --snapshot repo-snapshot.json --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
